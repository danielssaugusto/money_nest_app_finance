<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppFinance | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #111827);
            overflow: hidden;
        }

        /* CARD */
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: fadeUp 0.6s ease;
        }

        /* HEADER */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header-icon {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        .login-header i {
            font-size: 2.5rem;
            background: linear-gradient(45deg, var(--accent-glow), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-top: 0.5rem;
        }

        .login-header p {
            color: #94a3b8;
        }

        /* INPUTS */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            font-size: 0.8rem;
            color: #cbd5f5;
            margin-bottom: 0.3rem;
            display: block;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            transition: 0.2s;
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-group input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
        }

        /* BOTÃO */
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--secondary), var(--accent));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(110, 34, 197, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* TOGGLE */
        .toggle-auth {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .toggle-auth span {
            color: var(--secondary);
            cursor: pointer;
            font-weight: 700;
        }

        /* ANIMAÇÃO */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-header-icon">
                <i class="fas fa-chart-line"></i>
                <h1>MoneyNest</h1>
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;" id="auth-title">Acesse sua conta
                para continuar</p>
        </div>

        <form id="auth-form">
            <div id="register-fields">
                <div class="form-group">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label for="preferredName">Como quer ser chamado?</label>
                    <input type="text" id="preferredName" placeholder="Ex: Peh, Gabs...">
                </div>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="email@dominio.com">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" id="auth-submit">Entrar</button>
        </form>

        <div class="toggle-auth" id="auth-toggle-container">
            Ainda não tem conta? <span id="toggle-auth">Criar conta</span>
        </div>
    </div>

    <script>
        const form = document.getElementById('auth-form');
        const toggleBtn = document.getElementById('toggle-auth');
        const registerFields = document.getElementById('register-fields');
        const authTitle = document.getElementById('auth-title');
        const authSubmit = document.getElementById('auth-submit');

        let isRegister = false;

        toggleBtn.onclick = () => {
            isRegister = !isRegister;
            registerFields.style.display = isRegister ? 'block' : 'none';
            authTitle.textContent = isRegister ? 'Crie sua conta agora' : 'Acesse sua conta para continuar';
            authSubmit.textContent = isRegister ? 'Cadastrar' : 'Entrar';
            toggleBtn.textContent = isRegister ? 'Fazer login' : 'Criar conta';
            document.getElementById('auth-toggle-container').firstChild.textContent = isRegister ? 'Já tem uma conta? ' : 'Ainda não tem conta? ';
        };

        form.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const preferredName = document.getElementById('preferredName').value;

            const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
            const body = isRegister ? { email, password, name, preferredName } : { email, password };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userName', data.name);
                    localStorage.setItem('preferredName', data.preferredName);
                    localStorage.setItem('userEmail', data.email);
                    window.location.href = 'index.html';
                } else {
                    let errorMessage = `Erro HTTP: ${response.status}`;
                    try {
                        const err = await response.json();
                        errorMessage = err.message || err.error || `Erro ${response.status}`;
                    } catch (e) {
                        // Se não for JSON, pegamos o texto puro ou o status
                        const text = await response.text();
                        console.error('Resposta do servidor (não JSON):', text);
                        errorMessage = `Servidor retornou código ${response.status}. Verifique se o app está rodando.`;
                    }
                    Swal.fire({
                        icon: 'error',
                        title: 'Falha na Conexão',
                        text: errorMessage
                    });
                }
            } catch (err) {
                console.error(err);
            }
        };

        // Theme sync
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>

</html>
